<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Inventory Alchemist · Sales & Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="app.css" />
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="charts.jsx"></script>
<script type="text/babel" src="shell.jsx"></script>
<script type="text/babel" src="dashboard.jsx"></script>
<script type="text/babel" src="orders.jsx"></script>
<script type="text/babel" src="reports.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "light",
  "density": "comfortable",
  "store": "All stores",
  "primaryHue": "indigo"
}/*EDITMODE-END*/;

const HUES = {
  indigo:  { c: "#6366f1", text: "#4f46e5", soft: "#eef2ff",   darkC: "#818cf8", darkText: "#a5b4fc", darkSoft: "rgba(99,102,241,0.15)" },
  emerald: { c: "#10b981", text: "#047857", soft: "#d1fae5",   darkC: "#34d399", darkText: "#6ee7b7", darkSoft: "rgba(16,185,129,0.15)" },
  rose:    { c: "#e11d48", text: "#be123c", soft: "#ffe4e6",   darkC: "#fb7185", darkText: "#fda4af", darkSoft: "rgba(225,29,72,0.15)" },
  amber:   { c: "#d97706", text: "#b45309", soft: "#fef3c7",   darkC: "#fbbf24", darkText: "#fcd34d", darkSoft: "rgba(217,119,6,0.15)" },
};

function App() {
  const [tweaks, setTweak] = window.useTweaks(TWEAK_DEFAULTS);
  const [route, setRoute] = useState("dashboard");
  const [collapsed, setCollapsed] = useState(false);

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", tweaks.theme);
    document.documentElement.setAttribute("data-density", tweaks.density);
    const hue = HUES[tweaks.primaryHue] || HUES.indigo;
    const isDark = tweaks.theme === "dark";
    document.documentElement.style.setProperty("--primary", isDark ? hue.darkC : hue.c);
    document.documentElement.style.setProperty("--primary-text", isDark ? hue.darkText : hue.text);
    document.documentElement.style.setProperty("--primary-soft", isDark ? hue.darkSoft : hue.soft);
  }, [tweaks.theme, tweaks.density, tweaks.primaryHue]);

  const PageCmp =
    route === "orders"  ? window.Orders :
    route === "reports" ? window.Reports :
    window.Dashboard;
  const SidebarCmp = window.Shell.Sidebar;
  const TopbarCmp = window.Shell.Topbar;

  return (
    <div className={"app" + (collapsed ? " collapsed" : "")}>
      <SidebarCmp route={route} setRoute={setRoute} collapsed={collapsed} setCollapsed={setCollapsed} />
      <main style={{ minWidth: 0 }}>
        <TopbarCmp
          route={route}
          theme={tweaks.theme}
          setTheme={(t) => setTweak("theme", t)}
          store={tweaks.store}
          setStore={(s) => setTweak("store", s)}
        />
        <PageCmp />
      </main>

      <window.TweaksPanel title="Tweaks">
        <window.TweakSection title="Appearance">
          <window.TweakRadio label="Theme" value={tweaks.theme} onChange={(v) => setTweak("theme", v)}
            options={[{ label: "Light", value: "light" }, { label: "Dark", value: "dark" }]} />
          <window.TweakRadio label="Density" value={tweaks.density} onChange={(v) => setTweak("density", v)}
            options={[{ label: "Comfortable", value: "comfortable" }, { label: "Compact", value: "compact" }]} />
          <window.TweakColor label="Accent" value={tweaks.primaryHue} onChange={(v) => setTweak("primaryHue", v)}
            options={[
              { label: "Indigo", value: "indigo", color: "#6366f1" },
              { label: "Emerald", value: "emerald", color: "#10b981" },
              { label: "Rose", value: "rose", color: "#e11d48" },
              { label: "Amber", value: "amber", color: "#d97706" },
            ]} />
        </window.TweakSection>

        <window.TweakSection title="Workspace">
          <window.TweakSelect label="Active store" value={tweaks.store} onChange={(v) => setTweak("store", v)}
            options={[
              { label: "All stores", value: "All stores" },
              { label: "Soho · London", value: "Soho · London" },
              { label: "Spitalfields", value: "Spitalfields" },
              { label: "Manchester", value: "Manchester" },
            ]} />
        </window.TweakSection>

        <window.TweakSection title="Navigate">
          <window.TweakRadio label="Page" value={route} onChange={setRoute}
            options={[{ label: "Dashboard", value: "dashboard" }, { label: "Orders", value: "orders" }, { label: "Reports", value: "reports" }]} />
        </window.TweakSection>
      </window.TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
